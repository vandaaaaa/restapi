info:
  name: Search cities
  type: http
  seq: 8

http:
  method: GET
  url: http://localhost:8000/api/cities?search=a&county_id=1
  params:
    - name: search
      value: a
      type: query
    - name: county_id
      value: "1"
      type: query
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true
